name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install build

      - name: Resolve promotion release
        id: release
        env:
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          pr_number="$(gh api "repos/${GH_REPO}/commits/${GH_SHA}/pulls" --jq '[.[] | select(.base.ref == "main")][0].number // empty' 2>/dev/null || true)"
          if [ -z "${pr_number}" ]; then
            echo "No main pull request is associated with ${GH_SHA}; skipping release."
            echo 'publish=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          head_ref="$(gh pr view "${pr_number}" --repo "${GH_REPO}" --json headRefName --jq '.headRefName')"
          if [ "${head_ref}" != 'promote/staging-to-main' ]; then
            echo "PR #${pr_number} came from ${head_ref}; only staging promotions release."
            echo 'publish=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          labels="$(gh pr view "${pr_number}" --repo "${GH_REPO}" --json labels --jq '.labels[].name')"
          semver_labels="$(printf '%s\n' "${labels}" | grep '^semver:' || true)"
          semver_count="$(printf '%s\n' "${semver_labels}" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "${semver_count}" != '1' ]; then
            echo "Expected exactly one semver label on PR #${pr_number}; found ${semver_count}."
            exit 1
          fi

          version="$(python scripts/release_tools.py read-version)"
          package_version="$(python -c 'import zoom_sdk; print(zoom_sdk.__version__)')"
          test "${version}" = "${package_version}"
          echo 'publish=true' >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Stop if release already exists
        if: steps.release.outputs.publish == 'true'
        id: existing
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists; skipping."
            echo 'exists=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'exists=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Test and build Python release artifacts
        if: steps.release.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        run: |
          python -m pytest -m "not integration"
          python -m build

      - name: Create tag and GitHub Release
        if: steps.release.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes \
            --target "$(git rev-parse HEAD)"
